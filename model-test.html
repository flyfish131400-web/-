<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>爆小鸡 · 3版本模型比较</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111923;
  color:white;
  font-family:Arial,sans-serif;
}

canvas{display:block}

#title{
  position:fixed;
  left:14px;
  top:14px;
  z-index:10;
  padding:12px 15px;
  background:rgba(7,14,22,.92);
  border:2px solid #546b7c;
  border-radius:9px;
}

#title strong{
  font-size:19px;
}

#title div{
  margin-top:5px;
  font-size:11px;
  color:#9db5c6;
}

#status{
  position:fixed;
  right:14px;
  top:14px;
  z-index:10;
  width:290px;
  padding:12px;
  background:rgba(7,14,22,.93);
  border:2px solid #546b7c;
  border-radius:9px;
  font-size:11px;
  line-height:1.6;
}

.good{color:#66dc87}
.bad{color:#ff6666}

#controls{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  padding:8px;
  background:rgba(7,14,22,.93);
  border:2px solid #546b7c;
  border-radius:9px;
}

button{
  height:42px;
  min-width:72px;
  border:0;
  border-radius:6px;
  background:#d47736;
  color:#fff;
  font-weight:bold;
}

#labels{
  position:fixed;
  left:14px;
  bottom:15px;
  z-index:10;
  padding:10px 12px;
  background:rgba(7,14,22,.9);
  border:2px solid #546b7c;
  border-radius:8px;
  font-size:11px;
  line-height:1.7;
}

#error{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:100;
  display:none;
  width:min(700px,92vw);
  padding:18px;
  background:#171e27;
  border:3px solid #ff5555;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div id="title">
  <strong>🐔 爆小鸡 · MODEL SHOOTOUT</strong>
  <div>3只白鸡 + 3只狼 · 同场比较</div>
</div>

<div id="status">
  <b>加载状态</b><br>

  鸡 A：
  <span id="cA">Loading...</span><br>

  鸡 B：
  <span id="cB">Loading...</span><br>

  鸡 C：
  <span id="cC">Loading...</span><br>

  狼 A：
  <span id="wA">Loading...</span><br>

  狼 B：
  <span id="wB">Loading...</span><br>

  狼 C：
  <span id="wC">Loading...</span>

  <br><br>
  <span class="good">绿色箭头 = +Z</span>
</div>

<div id="labels">
  <b>上排：白鸡</b><br>
  A = V2<br>
  B = 第二个 V2<br>
  C = V3<br><br>

  <b>下排：狼</b><br>
  A = V2<br>
  B = 第二个 V2<br>
  C = V3
</div>

<div id="controls">
  <button id="front">正面</button>
  <button id="side">侧面</button>
  <button id="back">背面</button>
  <button id="top">俯视</button>
  <button id="angle">45°</button>
</div>

<div id="error"></div>


<script type="importmap">
{
  "imports":{
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
  OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* =========================
   SCENE
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x18212b);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  .1,
  120
);

camera.position.set(
  12,
  10,
  17
);


/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

/*
  故意压低曝光，
  避免模型看起来过分鲜艳。
*/
renderer.toneMappingExposure = 1.0;

document.body.prepend(
  renderer.domElement
);


/* =========================
   CONTROLS
========================= */

const controls =
new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.target.set(
  0,
  1.4,
  0
);


/* =========================
   LIGHTING
========================= */

/*
  比以前更克制的灯光。
*/

const hemi =
new THREE.HemisphereLight(
  0xaabfce,
  0x31332b,
  1.35
);

scene.add(hemi);


const key =
new THREE.DirectionalLight(
  0xf1ede4,
  2.15
);

key.position.set(
  8,
  13,
  9
);

key.castShadow = true;

key.shadow.mapSize.set(
  2048,
  2048
);

scene.add(key);


const fill =
new THREE.DirectionalLight(
  0x819bb0,
  .7
);

fill.position.set(
  -7,
  6,
  -5
);

scene.add(fill);


const warm =
new THREE.PointLight(
  0xc27f55,
  4.5,
  18
);

warm.position.set(
  -9,
  4,
  5
);

scene.add(warm);


/* =========================
   FLOOR
========================= */

const floor =
new THREE.Mesh(

  new THREE.PlaneGeometry(
    40,
    32
  ),

  new THREE.MeshStandardMaterial({
    color:0x39483e,
    roughness:.98,
    metalness:0
  })

);

floor.rotation.x =
-Math.PI/2;

floor.receiveShadow = true;

scene.add(floor);


/* =========================
   GRID
========================= */

const grid =
new THREE.GridHelper(
  40,
  40,
  0x667985,
  0x45545d
);

grid.position.y = .01;

scene.add(grid);


/* =========================
   +Z DIRECTION
========================= */

const arrow =
new THREE.ArrowHelper(

  new THREE.Vector3(
    0,0,1
  ),

  new THREE.Vector3(
    0,.04,0
  ),

  5,

  0x00dd88,

  .7,

  .32

);

scene.add(arrow);


/* =========================
   PEDESTALS
========================= */

function pedestal(
  x,
  z,
  color
){

  const p =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      4.3,
      .28,
      4.3
    ),

    new THREE.MeshStandardMaterial({
      color,
      roughness:.95
    })

  );

  p.position.set(
    x,
    .14,
    z
  );

  p.receiveShadow = true;

  scene.add(p);
}


/*
   上排鸡
*/

pedestal(
  -6,
  -3.4,
  0x536b78
);

pedestal(
  0,
  -3.4,
  0x556d79
);

pedestal(
  6,
  -3.4,
  0x586f79
);


/*
   下排狼
*/

pedestal(
  -6,
  3.7,
  0x685a53
);

pedestal(
  0,
  3.7,
  0x665851
);

pedestal(
  6,
  3.7,
  0x62554f
);


/* =========================
   MODEL LOADING
========================= */

const loader =
new GLTFLoader();

const models = {};


function prepareModel(
  model,
  x,
  z
){

  model.position.set(
    x,
    0,
    z
  );

  model.traverse(
  object=>{

    if(
      object.isMesh
    ){

      object.castShadow = true;

      object.receiveShadow = true;

      if(
        object.material
      ){

        /*
          防止 GLB 材质过亮、过塑料。
        */

        if(
          "roughness"
          in object.material
        ){

          object.material.roughness =
          Math.max(
            object.material.roughness ?? 0,
            .72
          );

        }

        if(
          "metalness"
          in object.material
        ){

          object.material.metalness =
          Math.min(
            object.material.metalness ?? 0,
            .08
          );

        }

        object.material.needsUpdate =
        true;
      }
    }
  });

  scene.add(model);
}


/* =========================
   AUTO NORMALIZE SIZE
========================= */

/*
  这里很重要。

  不同 AI 生成的模型尺寸
  很可能完全不同。

  所以测试时自动调整到合理高度，
  避免因为尺寸不同造成误判。
*/

function normalizeHeight(
  model,
  wantedHeight
){

  const box =
  new THREE.Box3()
  .setFromObject(model);

  const size =
  new THREE.Vector3();

  box.getSize(size);

  if(
    size.y > 0
  ){

    const scale =
    wantedHeight / size.y;

    model.scale.multiplyScalar(
      scale
    );
  }


  /*
    缩放后再计算脚底，
    自动把模型放到地面。
  */

  model.updateMatrixWorld(true);

  const newBox =
  new THREE.Box3()
  .setFromObject(model);

  model.position.y -=
  newBox.min.y;
}


/* =========================
   LOAD FUNCTION
========================= */

function loadModel(
  key,
  path,
  status,
  x,
  z,
  type
){

  loader.load(

    path,

    gltf=>{

      const model =
      gltf.scene;

      models[key] = model;

      normalizeHeight(
        model,
        type==="chicken"
        ? 2.45
        : 1.85
      );

      prepareModel(
        model,
        x,
        z
      );

      document
      .getElementById(status)
      .innerHTML =
      '<span class="good">LOADED ✓</span>';

      inspect(
        model,
        key
      );

    },

    undefined,

    error=>{

      document
      .getElementById(status)
      .innerHTML =
      '<span class="bad">FAILED ✕</span>';

      showError(
        key
        +
        "\n\n"
        +
        path
        +
        "\n\n"
        +
        String(error)
      );
    }

  );
}


/* =========================
   WHITE CHICKENS
========================= */

loadModel(
  "CHICKEN A - V2",
  "./white_chicken_v2.glb",
  "cA",
  -6,
  -3.4,
  "chicken"
);


/*
  文件名里面有空格。
  %20 = 空格。
*/

loadModel(
  "CHICKEN B - V2 SECOND",
  "./white_chicken_v2%202.glb",
  "cB",
  0,
  -3.4,
  "chicken"
);


loadModel(
  "CHICKEN C - V3",
  "./white_chicken_v3.glb",
  "cC",
  6,
  -3.4,
  "chicken"
);


/* =========================
   WOLVES
========================= */

loadModel(
  "WOLF A - V2",
  "./wolf_v2.glb",
  "wA",
  -6,
  3.7,
  "wolf"
);


loadModel(
  "WOLF B - V2 SECOND",
  "./wolf_v2%202.glb",
  "wB",
  0,
  3.7,
  "wolf"
);


loadModel(
  "WOLF C - V3",
  "./wolf_v3.glb",
  "wC",
  6,
  3.7,
  "wolf"
);


/* =========================
   MODEL INFO
========================= */

function inspect(
  model,
  name
){

  const box =
  new THREE.Box3()
  .setFromObject(model);

  const size =
  new THREE.Vector3();

  box.getSize(size);

  console.log(
    name,
    {
      width:size.x,
      height:size.y,
      depth:size.z
    }
  );
}


/* =========================
   ERROR
========================= */

function showError(text){

  const box =
  document.getElementById(
    "error"
  );

  box.textContent = text;

  box.style.display =
  "block";
}


/* =========================
   CAMERA
========================= */

function moveCamera(
  x,
  y,
  z
){

  camera.position.set(
    x,
    y,
    z
  );

  controls.target.set(
    0,
    1.3,
    0
  );

  controls.update();
}


document
.getElementById("front")
.onclick =
()=>{

  moveCamera(
    0,
    5,
    20
  );
};


document
.getElementById("side")
.onclick =
()=>{

  moveCamera(
    20,
    5,
    0
  );
};


document
.getElementById("back")
.onclick =
()=>{

  moveCamera(
    0,
    5,
    -20
  );
};


document
.getElementById("top")
.onclick =
()=>{

  moveCamera(
    0,
    22,
    .01
  );
};


document
.getElementById("angle")
.onclick =
()=>{

  moveCamera(
    12,
    10,
    17
  );
};


/* =========================
   RENDER LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

  camera.aspect =
  innerWidth /
  innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>
</body>
</html>
