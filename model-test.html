<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>爆小鸡 GLB V1 / V2 对比</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101722;
  color:#fff;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#title{
  position:fixed;
  left:15px;
  top:15px;
  z-index:10;

  padding:12px 15px;

  background:rgba(8,15,24,.9);
  border:2px solid #60798e;
  border-radius:8px;
}

#title strong{
  font-size:19px;
}

#title div{
  margin-top:5px;
  font-size:12px;
  color:#a9c4d7;
}

#status{
  position:fixed;
  right:15px;
  top:15px;
  z-index:10;

  width:285px;
  padding:12px;

  background:rgba(8,15,24,.9);
  border:2px solid #60798e;
  border-radius:8px;

  font-size:12px;
  line-height:1.7;
}

.good{
  color:#66e38a;
}

.bad{
  color:#ff6969;
}

#legend{
  position:fixed;
  left:15px;
  bottom:18px;
  z-index:10;

  padding:10px 14px;

  background:rgba(8,15,24,.9);
  border:2px solid #60798e;
  border-radius:8px;

  font-size:12px;
  line-height:1.7;
}

#buttons{
  position:fixed;
  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  gap:7px;

  padding:8px;

  background:rgba(8,15,24,.9);
  border:2px solid #60798e;
  border-radius:8px;
}

button{
  height:42px;
  min-width:72px;

  border:0;
  border-radius:6px;

  background:#ff8537;
  color:white;

  font-weight:bold;
  cursor:pointer;
}

#error{
  position:fixed;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:100;

  display:none;

  width:min(700px,92vw);

  padding:20px;

  background:#171e28;

  border:3px solid #ff5353;

  color:white;

  white-space:pre-wrap;
  word-break:break-word;
}

</style>
</head>

<body>

<div id="title">

  <strong>
    🐔 爆小鸡 · V1 / V2 MODEL TEST
  </strong>

  <div>
    白鸡 + 狼 · 新旧模型直接对比
  </div>

</div>


<div id="status">

  <b>加载状态</b>

  <br>

  白鸡 V1：
  <span id="c1">Loading...</span>

  <br>

  白鸡 V2：
  <span id="c2">Loading...</span>

  <br>

  狼 V1：
  <span id="w1">Loading...</span>

  <br>

  狼 V2：
  <span id="w2">Loading...</span>

  <br><br>

  <span class="good">
    绿色箭头 = +Z
  </span>

</div>


<div id="legend">

  左上：白鸡 V1

  <br>

  右上：白鸡 V2

  <br>

  左下：狼 V1

  <br>

  右下：狼 V2

</div>


<div id="buttons">

  <button id="front">
    正面
  </button>

  <button id="side">
    侧面
  </button>

  <button id="back">
    背面
  </button>

  <button id="top">
    俯视
  </button>

  <button id="angle">
    45°
  </button>

</div>


<div id="error"></div>


<script type="importmap">
{
  "imports":{
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE
from "three";


import {
  GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


import {
  OrbitControls
}
from "three/addons/controls/OrbitControls.js";



/* ===========================
   SCENE
=========================== */


const scene=
new THREE.Scene();


scene.background=
new THREE.Color(
  0x172332
);



/* ===========================
   CAMERA
=========================== */


const camera=
new THREE.PerspectiveCamera(

  45,

  innerWidth/innerHeight,

  .1,

  100

);


camera.position.set(
  10,
  8,
  14
);



/* ===========================
   RENDERER
=========================== */


const renderer=
new THREE.WebGLRenderer({

  antialias:true

});


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.shadowMap.enabled=
true;


renderer.outputColorSpace=
THREE.SRGBColorSpace;


renderer.toneMapping=
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure=
1.18;


document.body.prepend(
  renderer.domElement
);



/* ===========================
   CONTROLS
=========================== */


const controls=
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping=
true;


controls.target.set(
  0,
  1.5,
  0
);



/* ===========================
   LIGHTING
=========================== */


scene.add(

  new THREE.HemisphereLight(

    0xb6d2e4,

    0x26331f,

    1.85

  )

);



const keyLight=
new THREE.DirectionalLight(

  0xf4f1ea,

  2.6

);


keyLight.position.set(
  8,
  13,
  9
);


keyLight.castShadow=
true;


scene.add(
  keyLight
);



const warm=
new THREE.PointLight(

  0xd78a58,

  9,

  18

);


warm.position.set(
  -8,
  4,
  4
);


scene.add(
  warm
);



const cool=
new THREE.PointLight(

  0x6a91aa,

  7,

  18

);


cool.position.set(
  8,
  4,
  -5
);


scene.add(
  cool
);



/* ===========================
   FLOOR
=========================== */


const floor=
new THREE.Mesh(

  new THREE.PlaneGeometry(
    36,
    36
  ),

  new THREE.MeshStandardMaterial({

    color:0x3a4d40,

    roughness:.95

  })

);


floor.rotation.x=
-Math.PI/2;


floor.receiveShadow=
true;


scene.add(
  floor
);



/* ===========================
   GRID
=========================== */


const grid=
new THREE.GridHelper(

  36,

  36,

  0x71899a,

  0x465864

);


grid.position.y=
.01;


scene.add(
  grid
);



/* ===========================
   +Z ARROW
=========================== */


const arrow=
new THREE.ArrowHelper(

  new THREE.Vector3(
    0,
    0,
    1
  ),

  new THREE.Vector3(
    0,
    .04,
    0
  ),

  5,

  0x00ff88,

  .7,

  .35

);


scene.add(
  arrow
);



/* ===========================
   PEDESTALS
=========================== */


function pedestal(
  x,
  z,
  color
){

  const mesh=
  new THREE.Mesh(

    new THREE.BoxGeometry(
      4.8,
      .32,
      4.8
    ),

    new THREE.MeshStandardMaterial({

      color,

      roughness:.9

    })

  );


  mesh.position.set(
    x,
    .16,
    z
  );


  mesh.receiveShadow=
  true;


  scene.add(
    mesh
  );

}


pedestal(
  -4.2,
  -3,
  0x526d80
);


pedestal(
  4.2,
  -3,
  0x496576
);


pedestal(
  -4.2,
  3.4,
  0x6f5a54
);


pedestal(
  4.2,
  3.4,
  0x654f4b
);



/* ===========================
   LOADER
=========================== */


const loader=
new GLTFLoader();


const models={};



function prepare(
  model,
  x,
  z
){

  model.position.set(
    x,
    0,
    z
  );


  model.traverse(
  object=>{

    if(
      object.isMesh
    ){

      object.castShadow=
      true;


      object.receiveShadow=
      true;


      if(
        object.material
      ){

        object.material.needsUpdate=
        true;

      }

    }

  });


  scene.add(
    model
  );

}



/* ===========================
   LOAD HELPER
=========================== */


function loadModel(
  key,
  path,
  statusId,
  x,
  z
){

  loader.load(

    path,

    gltf=>{

      models[key]=
      gltf.scene;


      prepare(
        models[key],
        x,
        z
      );


      document
      .getElementById(
        statusId
      )
      .innerHTML=
      '<span class="good">LOADED ✓</span>';


      inspectModel(
        models[key],
        key
      );

    },


    undefined,


    error=>{

      document
      .getElementById(
        statusId
      )
      .innerHTML=
      '<span class="bad">FAILED ✕</span>';


      showError(

        key

        +

        " FAILED TO LOAD\n\n"

        +

        String(error)

        +

        "\n\nPATH:\n"

        +

        path

      );

    }

  );

}



/* ===========================
   LOAD ALL 4 MODELS
=========================== */


loadModel(

  "WHITE CHICKEN V1",

  "./white_chicken.glb",

  "c1",

  -4.2,

  -3

);


loadModel(

  "WHITE CHICKEN V2",

  "./white_chicken_v2.glb",

  "c2",

  4.2,

  -3

);


loadModel(

  "WOLF V1",

  "./wolf.glb",

  "w1",

  -4.2,

  3.4

);


loadModel(

  "WOLF V2",

  "./wolf_v2.glb",

  "w2",

  4.2,

  3.4

);



/* ===========================
   INSPECT
=========================== */


function inspectModel(
  model,
  name
){

  const box=
  new THREE.Box3()
  .setFromObject(
    model
  );


  const size=
  new THREE.Vector3();


  const center=
  new THREE.Vector3();


  box.getSize(
    size
  );


  box.getCenter(
    center
  );


  console.log(
    name,
    {
      size,
      center,
      min:box.min,
      max:box.max
    }
  );

}



/* ===========================
   ERROR
=========================== */


function showError(
  text
){

  const errorBox=
  document.getElementById(
    "error"
  );


  errorBox.textContent=
  text;


  errorBox.style.display=
  "block";

}



/* ===========================
   CAMERA PRESETS
=========================== */


function moveCamera(
  x,
  y,
  z
){

  camera.position.set(
    x,
    y,
    z
  );


  controls.target.set(
    0,
    1.5,
    0
  );


  controls.update();

}



document
.getElementById(
  "front"
)
.onclick=
()=>{

  moveCamera(
    0,
    5,
    17
  );

};



document
.getElementById(
  "side"
)
.onclick=
()=>{

  moveCamera(
    17,
    5,
    0
  );

};



document
.getElementById(
  "back"
)
.onclick=
()=>{

  moveCamera(
    0,
    5,
    -17
  );

};



document
.getElementById(
  "top"
)
.onclick=
()=>{

  moveCamera(
    0,
    20,
    .01
  );

};



document
.getElementById(
  "angle"
)
.onclick=
()=>{

  moveCamera(
    10,
    8,
    14
  );

};



/* ===========================
   LOOP
=========================== */


function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();



/* ===========================
   RESIZE
=========================== */


window.addEventListener(
"resize",
()=>{

  camera.aspect=
  innerWidth/innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>

</body>
</html>
