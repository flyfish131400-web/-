<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>爆小鸡 GLB 模型测试</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101722;
  color:white;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#title{
  position:fixed;
  left:15px;
  top:15px;
  z-index:10;

  padding:12px 15px;

  background:rgba(8,15,24,.88);
  border:2px solid #60798e;
  border-radius:8px;
}

#title strong{
  font-size:20px;
}

#title div{
  margin-top:5px;
  font-size:12px;
  color:#a9c4d7;
}

#status{
  position:fixed;
  right:15px;
  top:15px;
  z-index:10;

  width:270px;

  padding:12px;

  background:rgba(8,15,24,.9);
  border:2px solid #60798e;
  border-radius:8px;

  font-size:12px;
  line-height:1.7;
}

.good{
  color:#66e38a;
}

.bad{
  color:#ff6868;
}

#buttons{
  position:fixed;
  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  gap:7px;

  padding:8px;

  background:rgba(8,15,24,.88);
  border:2px solid #60798e;
  border-radius:8px;
}

button{
  height:42px;
  min-width:75px;

  border:0;
  border-radius:6px;

  background:#ff8537;
  color:white;

  font-weight:bold;
}

#error{
  position:fixed;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:100;

  display:none;

  width:min(650px,90vw);

  padding:20px;

  background:#171e28;

  border:3px solid #ff5353;

  color:white;

  white-space:pre-wrap;
  word-break:break-word;
}

</style>
</head>

<body>

<div id="title">

  <strong>
    🐔 爆小鸡 · GLB TEST
  </strong>

  <div>
    white_chicken.glb + wolf.glb
  </div>

</div>


<div id="status">

  <b>模型状态</b>

  <br>

  白鸡：
  <span id="chickenStatus">
    Loading...
  </span>

  <br>

  狼：
  <span id="wolfStatus">
    Loading...
  </span>

  <br><br>

  <span class="good">
    绿色箭头 = +Z
  </span>

  <br>

  左边应该是白鸡

  <br>

  右边应该是狼

</div>


<div id="buttons">

  <button id="front">
    正面
  </button>

  <button id="side">
    侧面
  </button>

  <button id="back">
    背面
  </button>

  <button id="top">
    俯视
  </button>

  <button id="angle">
    45°
  </button>

</div>


<div id="error"></div>


<script type="importmap">

{
  "imports":{

    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

  }
}

</script>


<script type="module">

import * as THREE
from "three";


import {
  GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


import {
  OrbitControls
}
from "three/addons/controls/OrbitControls.js";



/* ========================================
   SCENE
======================================== */


const scene=
new THREE.Scene();


scene.background=
new THREE.Color(
  0x172332
);



/* ========================================
   CAMERA
======================================== */


const camera=
new THREE.PerspectiveCamera(

  45,

  innerWidth/innerHeight,

  .1,

  100

);


camera.position.set(
  8,
  6,
  10
);



/* ========================================
   RENDERER
======================================== */


const renderer=
new THREE.WebGLRenderer({

  antialias:true

});


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.shadowMap.enabled=
true;


renderer.outputColorSpace=
THREE.SRGBColorSpace;


renderer.toneMapping=
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure=
1.3;


document.body.prepend(
  renderer.domElement
);



/* ========================================
   CAMERA CONTROLS
======================================== */


const controls=
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping=
true;


controls.target.set(
  0,
  1.5,
  0
);



/* ========================================
   LIGHTS
======================================== */


scene.add(

  new THREE.HemisphereLight(
    0xc8e4ff,
    0x28391e,
    2.2
  )

);



const sun=
new THREE.DirectionalLight(
  0xffffff,
  3
);


sun.position.set(
  7,
  12,
  8
);


sun.castShadow=
true;


scene.add(
  sun
);



const warm=
new THREE.PointLight(
  0xff994d,
  16,
  15
);


warm.position.set(
  -5,
  4,
  4
);


scene.add(
  warm
);



const blue=
new THREE.PointLight(
  0x55baff,
  12,
  15
);


blue.position.set(
  5,
  4,
  -3
);


scene.add(
  blue
);



/* ========================================
   FLOOR
======================================== */


const floor=
new THREE.Mesh(

  new THREE.PlaneGeometry(
    30,
    30
  ),

  new THREE.MeshStandardMaterial({

    color:0x3d5945,

    roughness:.9

  })

);


floor.rotation.x=
-Math.PI/2;


floor.receiveShadow=
true;


scene.add(
  floor
);



/* ========================================
   GRID
======================================== */


const grid=
new THREE.GridHelper(

  30,

  30,

  0x90b1c5,

  0x536a79

);


grid.position.y=
.01;


scene.add(
  grid
);



/* ========================================
   +Z ARROW
======================================== */


const arrow=
new THREE.ArrowHelper(

  new THREE.Vector3(
    0,
    0,
    1
  ),

  new THREE.Vector3(
    0,
    .05,
    0
  ),

  5,

  0x00ff88,

  .7,

  .35

);


scene.add(
  arrow
);



/* ========================================
   PEDESTALS
======================================== */


function makePedestal(
  x,
  color
){

  const mesh=
  new THREE.Mesh(

    new THREE.BoxGeometry(
      4,
      .3,
      4
    ),

    new THREE.MeshStandardMaterial({
      color
    })

  );


  mesh.position.set(
    x,
    .15,
    0
  );


  mesh.receiveShadow=
  true;


  scene.add(
    mesh
  );

}


makePedestal(
  -3,
  0x4d6d84
);


makePedestal(
  3,
  0x745d53
);



/* ========================================
   GLTF LOADER
======================================== */


const loader=
new GLTFLoader();


let chicken=null;

let wolf=null;



/* ========================================
   MODEL PREPARATION
======================================== */


function prepare(
  model,
  x
){

  model.position.set(
    x,
    0,
    0
  );


  model.traverse(
  object=>{

    if(
      object.isMesh
    ){

      object.castShadow=
      true;


      object.receiveShadow=
      true;

    }

  });


  scene.add(
    model
  );

}



/* ========================================
   WHITE CHICKEN

   IMPORTANT:
   MODEL IS IN ROOT DIRECTORY
======================================== */


loader.load(

  "./white_chicken.glb",

  gltf=>{

    chicken=
    gltf.scene;


    prepare(
      chicken,
      -3
    );


    document
    .getElementById(
      "chickenStatus"
    )
    .innerHTML=
    '<span class="good">LOADED ✓</span>';


    inspectModel(
      chicken,
      "WHITE CHICKEN"
    );

  },


  undefined,


  error=>{

    document
    .getElementById(
      "chickenStatus"
    )
    .innerHTML=
    '<span class="bad">FAILED ✕</span>';


    showError(

      "WHITE CHICKEN FAILED\n\n"

      +

      String(error)

      +

      "\n\n正确路径应该是：\n"

      +

      "./white_chicken.glb"

    );

  }

);



/* ========================================
   WOLF

   IMPORTANT:
   MODEL IS IN ROOT DIRECTORY
======================================== */


loader.load(

  "./wolf.glb",

  gltf=>{

    wolf=
    gltf.scene;


    prepare(
      wolf,
      3
    );


    document
    .getElementById(
      "wolfStatus"
    )
    .innerHTML=
    '<span class="good">LOADED ✓</span>';


    inspectModel(
      wolf,
      "WOLF"
    );

  },


  undefined,


  error=>{

    document
    .getElementById(
      "wolfStatus"
    )
    .innerHTML=
    '<span class="bad">FAILED ✕</span>';


    showError(

      "WOLF FAILED\n\n"

      +

      String(error)

      +

      "\n\n正确路径应该是：\n"

      +

      "./wolf.glb"

    );

  }

);



/* ========================================
   MODEL INSPECTION
======================================== */


function inspectModel(
  model,
  name
){

  const box=
  new THREE.Box3()
  .setFromObject(
    model
  );


  const size=
  new THREE.Vector3();


  const center=
  new THREE.Vector3();


  box.getSize(
    size
  );


  box.getCenter(
    center
  );


  console.log(
    name,
    {
      size:{
        x:size.x,
        y:size.y,
        z:size.z
      },

      center:{
        x:center.x,
        y:center.y,
        z:center.z
      },

      min:{
        x:box.min.x,
        y:box.min.y,
        z:box.min.z
      },

      max:{
        x:box.max.x,
        y:box.max.y,
        z:box.max.z
      }
    }
  );

}



/* ========================================
   ERROR
======================================== */


function showError(
  text
){

  const box=
  document.getElementById(
    "error"
  );


  box.textContent=
  text;


  box.style.display=
  "block";

}



/* ========================================
   CAMERA PRESETS
======================================== */


function moveCamera(
  x,
  y,
  z
){

  camera.position.set(
    x,
    y,
    z
  );


  controls.target.set(
    0,
    1.5,
    0
  );


  controls.update();

}



document
.getElementById(
  "front"
)
.onclick=
()=>{

  moveCamera(
    0,
    3,
    12
  );

};



document
.getElementById(
  "side"
)
.onclick=
()=>{

  moveCamera(
    12,
    3,
    0
  );

};



document
.getElementById(
  "back"
)
.onclick=
()=>{

  moveCamera(
    0,
    3,
    -12
  );

};



document
.getElementById(
  "top"
)
.onclick=
()=>{

  moveCamera(
    0,
    15,
    .01
  );

};



document
.getElementById(
  "angle"
)
.onclick=
()=>{

  moveCamera(
    8,
    6,
    10
  );

};



/* ========================================
   ANIMATION LOOP
======================================== */


function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();



/* ========================================
   RESIZE
======================================== */


window.addEventListener(
"resize",
()=>{

  camera.aspect=
  innerWidth/innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>

</body>
</html>
