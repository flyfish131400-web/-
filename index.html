<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>爆小鸡 BOOM CHICKEN</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Orbitron:wght@600;700;800&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b121b;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  font-family:"Lilita One",sans-serif;
}

canvas,
button,
#touchLayer{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

button{
  font-family:"Lilita One",sans-serif;
}

:root{
  --orange:#ff8a30;
  --yellow:#ffd354;
  --blue:#65d4ff;
  --red:#ff4e4e;
}

.blockPanel{
  background:linear-gradient(180deg,#26394b,#172535);
  border:4px solid #60798f;
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.12),
    0 7px 0 #0b1219,
    0 14px 26px rgba(0,0,0,.28);
  border-radius:8px;
  color:#fff;
}

.blockButton{
  border:4px solid rgba(255,255,255,.25);
  border-bottom-color:rgba(0,0,0,.4);
  background:linear-gradient(180deg,#ffad4b,#ed7423);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.28),
    0 6px 0 #87390f;
  border-radius:7px;
  color:#fff;
  cursor:pointer;
  text-shadow:0 2px 0 rgba(0,0,0,.3);
}

.blockButton:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #87390f;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#081019;
  color:white;
  transition:opacity .7s;
}

#intro.hide{
  opacity:0;
  pointer-events:none;
}

#intro h1{
  margin:0;
  font:clamp(42px,9vw,104px) "Bungee";
  line-height:.9;
  text-align:center;
}

#intro h1 span{
  color:var(--orange);
}

#intro .sub{
  margin-top:16px;
  text-align:center;
  color:#a9c3d7;
  font:12px "Orbitron";
  letter-spacing:5px;
}

/* LOBBY */

#lobby{
  position:fixed;
  inset:0;
  z-index:50;
  padding:18px;
  pointer-events:none;
}

#lobby>*{
  pointer-events:auto;
}

#logoBox{
  position:absolute;
  left:18px;
  top:18px;
  padding:14px 18px;
}

.gameTitle{
  font:clamp(26px,4vw,48px) "Bungee";
  line-height:.9;
}

.gameTitle span{
  color:var(--orange);
}

.gameSub{
  margin-top:6px;
  color:#a8bed0;
  font:10px "Orbitron";
  letter-spacing:2px;
}

#resources{
  position:absolute;
  right:18px;
  top:18px;
  padding:10px 14px;
  display:flex;
  gap:20px;
}

.res{
  text-align:center;
}

.resName{
  font:9px "Orbitron";
  color:#9eb7ca;
}

.resValue{
  font-size:19px;
  margin-top:3px;
}

#langToggle{
  position:absolute;
  right:18px;
  top:92px;
  height:38px;
  padding:0 12px;
  font:11px "Orbitron";
}

#selectedCard{
  position:absolute;
  left:18px;
  top:125px;
  width:230px;
  padding:13px 16px;
}

#selectedName{
  font-size:22px;
}

#selectedStars{
  color:var(--yellow);
  margin-top:3px;
}

#selectedInfo{
  margin-top:8px;
  color:#bfd0dd;
  font-size:12px;
  line-height:1.5;
}

#machines{
  position:absolute;
  left:18px;
  bottom:22px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  max-width:500px;
}

.machineBtn{
  width:110px;
  height:98px;
  padding:8px;
}

.machineBtn .icon{
  font-size:32px;
}

.machineBtn .name{
  font-size:14px;
  margin-top:4px;
}

#battlePanel{
  position:absolute;
  right:22px;
  bottom:24px;
  width:292px;
  padding:13px;
}

#startBattleBtn{
  width:100%;
  height:68px;
  font:20px "Bungee";
}

.selectorLabel{
  margin-top:12px;
  color:#94aec2;
  font:9px "Orbitron";
  letter-spacing:1px;
}

.selector{
  margin-top:5px;
  height:46px;
  display:grid;
  grid-template-columns:45px 1fr 45px;
  align-items:center;
  background:#0e1923;
  border:3px solid #455f74;
}

.selector button{
  height:100%;
  border:0;
  background:#25394a;
  color:#fff;
  font-size:20px;
}

.selector div{
  text-align:center;
  font-size:16px;
}

/* MODALS */

.modalWrap{
  position:fixed;
  inset:0;
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,8,13,.78);
  padding:18px;
}

.modalWrap.show{
  display:flex;
}

.modal{
  width:min(920px,96vw);
  max-height:90vh;
  overflow:auto;
  padding:18px;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modalTitle{
  font:26px "Bungee";
}

.close{
  width:40px;
  height:40px;
  border:0;
  background:#3b5061;
  color:white;
  font-size:18px;
}

/* ROSTER */

#rosterGrid{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.chickenCard{
  padding:12px;
  min-height:145px;
  background:#101b26;
  border:3px solid #334a5c;
  color:#fff;
  cursor:pointer;
}

.chickenCard.locked{
  filter:grayscale(1);
  opacity:.55;
}

.cardColor{
  width:45px;
  height:45px;
  margin:auto;
  border:4px solid rgba(255,255,255,.35);
}

.cardName{
  text-align:center;
  margin-top:8px;
}

.cardStars{
  text-align:center;
  color:var(--yellow);
  font-size:11px;
}

.cardWeapon{
  text-align:center;
  color:#91b2c9;
  font-size:10px;
  margin-top:5px;
}

/* GACHA */

#gachaLayout{
  margin-top:16px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
}

#gachaMachine,
#gachaResult{
  min-height:360px;
  background:#0f1b26;
  border:4px solid #425c70;
  position:relative;
  text-align:center;
}

#machineBubble{
  position:absolute;
  left:50%;
  top:28px;
  width:240px;
  height:195px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#ecfaff,#7bcdf4 55%,#3e83aa);
  border:9px solid #eaf7ff;
  overflow:hidden;
}

.smallEgg{
  position:absolute;
  width:32px;
  height:40px;
  border-radius:50%;
  background:#ffe3a1;
  border:3px solid #fff2cf;
}

#machineBody{
  position:absolute;
  left:50%;
  bottom:18px;
  width:182px;
  height:160px;
  transform:translateX(-50%);
  background:#ff8a30;
  border:8px solid #ffc07a;
}

#machineHandle{
  position:absolute;
  right:-40px;
  top:28px;
  width:24px;
  height:85px;
  background:#ffd56d;
  transform-origin:top center;
}

#machineHandle::after{
  content:"";
  position:absolute;
  left:-9px;
  bottom:-17px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ff4b4b;
  border:5px solid #ffc2c2;
}

#gachaEgg{
  display:none;
  position:absolute;
  left:50%;
  bottom:25px;
  width:108px;
  height:135px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#ffe5a4;
  border:7px solid #fff3d1;
  z-index:4;
}

#gachaEgg.show{
  display:block;
}

#gachaEgg.shake{
  animation:shake .14s infinite alternate;
}

@keyframes shake{
  from{transform:translateX(-50%) rotate(-6deg)}
  to{transform:translateX(-50%) rotate(6deg)}
}

#resultChicken{
  font-size:68px;
  margin-top:70px;
}

#resultName{
  font-size:25px;
  margin-top:8px;
}

#resultStars{
  color:var(--yellow);
  margin-top:5px;
}

#gachaCost{
  color:#acc5d7;
  margin:14px 18px;
}

#gachaRoll{
  width:90%;
  height:56px;
  font:16px "Bungee";
}

/* HUD */

#hud{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
  color:white;
}

.hudPanel{
  background:rgba(10,19,28,.86);
  border:3px solid rgba(120,150,175,.82);
  box-shadow:0 5px 0 rgba(0,0,0,.4);
}

#hudTopLeft{
  position:absolute;
  left:14px;
  top:14px;
  padding:9px 12px;
}

#hudTopCenter{
  position:absolute;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  padding:8px 18px;
  text-align:center;
}

#hudTopRight{
  position:absolute;
  right:14px;
  top:14px;
  padding:9px 12px;
  text-align:right;
}

.bigHud{
  font-size:20px;
}

.smallHud{
  font:9px "Orbitron";
  color:#9fb8cc;
}

#playerHP{
  position:absolute;
  left:14px;
  bottom:16px;
  width:220px;
}

#hpText{
  font-size:13px;
}

.barBG{
  height:15px;
  background:#16212b;
  border:2px solid #53697b;
}

.barFill{
  height:100%;
}

#hpFill{
  width:100%;
  background:#60d46c;
}

#xpFill{
  width:0;
  background:#64ccff;
}

#skillHud{
  position:absolute;
  right:14px;
  bottom:16px;
  width:185px;
  padding:10px;
  text-align:center;
}

#skillName{
  font-size:17px;
}

#skillCD{
  margin-top:5px;
  font:10px "Orbitron";
  color:#aec3d2;
}

#message{
  position:absolute;
  left:50%;
  top:22%;
  transform:translateX(-50%);
  font:27px "Bungee";
  text-shadow:0 3px #000;
  opacity:0;
}

#message.show{
  opacity:1;
}

.damage{
  position:fixed;
  z-index:250;
  pointer-events:none;
  color:#fff;
  font:22px "Bungee";
  text-shadow:-2px -2px #000,2px -2px #000,-2px 2px #000,2px 2px #000;
  animation:dmg .7s forwards;
}

@keyframes dmg{
  from{transform:translate(-50%,-50%);opacity:1}
  to{transform:translate(-50%,-115%);opacity:0}
}

.enemyMarker{
  position:fixed;
  z-index:180;
  pointer-events:none;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#ff3535;
  border:3px solid white;
  box-shadow:0 0 10px #ff3535;
  transform:translate(-50%,-50%);
}

#dangerIndicator{
  position:fixed;
  z-index:190;
  display:none;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  font:38px "Bungee";
  color:#ff3c3c;
}

/* MOBILE */

#touchLayer{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:auto;
}

#moveBase{
  display:none;
  position:absolute;
  width:138px;
  height:138px;
  border-radius:50%;
  background:rgba(10,20,30,.28);
  border:4px solid rgba(255,255,255,.38);
  transform:translate(-50%,-50%);
  z-index:5;
}

#moveKnob{
  position:absolute;
  width:54px;
  height:54px;
  left:38px;
  top:38px;
  border-radius:50%;
  background:rgba(255,255,255,.8);
}

#shootMobile{
  display:none;
  position:absolute;
  right:22px;
  bottom:22px;
  width:100px;
  height:100px;
  border-radius:50%;
  pointer-events:auto;
  z-index:10;
}

#skillMobile{
  display:none;
  position:absolute;
  right:124px;
  bottom:82px;
  width:84px;
  height:84px;
  pointer-events:auto;
  z-index:10;
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  z-index:900;
  align-items:center;
  justify-content:center;
  background:rgba(4,8,12,.82);
}

#gameOverCard{
  width:min(440px,90vw);
  padding:24px;
  text-align:center;
}

#gameOverTitle{
  font:38px "Bungee";
  color:#ff8241;
}

#gameOverStats{
  margin-top:14px;
  line-height:1.8;
  font:12px "Orbitron";
}

#returnLobby{
  width:100%;
  height:55px;
  margin-top:17px;
}

#tutorialModal .modal{
  width:min(650px,94vw);
  text-align:center;
}

#tutorialIcon{
  font-size:58px;
}

#tutorialTitle{
  font:28px "Bungee";
  color:var(--yellow);
  margin:10px 0;
}

#tutorialText{
  font-size:18px;
}

#tutorialControls{
  font:11px "Orbitron";
  color:#8fcdf1;
  margin:12px 0;
}

#tutorialNext{
  width:100%;
  height:56px;
}

@media(pointer:coarse){
  #touchLayer,
  #skillMobile,
  #shootMobile{
    display:block;
  }

  #skillHud{
    display:none;
  }

  #playerHP{
    width:158px;
  }

  #rosterGrid{
    grid-template-columns:repeat(3,1fr);
  }

  #gachaLayout{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<div id="intro">
  <div>
    <h1>BOOM <span>CHICKEN</span></h1>
    <div class="sub">爆 小 鸡</div>
  </div>
</div>

<div id="lobby">

  <div id="logoBox" class="blockPanel">
    <div class="gameTitle">爆<span>小鸡</span></div>
    <div class="gameSub">BOOM CHICKEN</div>
  </div>

  <button id="langToggle" class="blockButton" onclick="toggleLanguage()">中文</button>

  <div id="resources" class="blockPanel">
    <div class="res">
      <div class="resName">EGGS</div>
      <div class="resValue">🥚 <span id="lobbyEggs">1000</span></div>
    </div>

    <div class="res">
      <div class="resName">RANK</div>
      <div class="resValue" id="lobbyRank">UNRANKED</div>
    </div>
  </div>

  <div id="selectedCard" class="blockPanel">
    <div id="selectedName"></div>
    <div id="selectedStars"></div>
    <div id="selectedInfo"></div>
  </div>

  <div id="machines">

    <button class="machineBtn blockButton" onclick="openRoster()">
      <div class="icon">🐔</div>
      <div class="name" id="chickensLabel">CHICKENS</div>
    </button>

    <button class="machineBtn blockButton" onclick="openGacha()">
      <div class="icon">🥚</div>
      <div class="name">GACHA</div>
    </button>

    <button class="machineBtn blockButton" onclick="showLobbyMessage()">
      <div class="icon">📋</div>
      <div class="name" id="missionsLabel">MISSIONS</div>
    </button>

    <button class="machineBtn blockButton" onclick="openTutorial()">
      <div class="icon">❓</div>
      <div class="name" id="howToLabel">HOW TO PLAY</div>
    </button>

  </div>

  <div id="battlePanel" class="blockPanel">

    <button id="startBattleBtn" class="blockButton" onclick="startBattle()">
      START BATTLE
    </button>

    <div id="modeLabel" class="selectorLabel">MODE</div>

    <div class="selector">
      <button onclick="changeMode(-1)">◀</button>
      <div id="modeName">SURVIVAL</div>
      <button onclick="changeMode(1)">▶</button>
    </div>

    <div id="mapLabel" class="selectorLabel">MAP</div>

    <div class="selector">
      <button>◀</button>
      <div>NIGHT ARENA</div>
      <button>▶</button>
    </div>

  </div>

</div>

<div id="rosterModal" class="modalWrap">
  <div class="modal blockPanel">

    <div class="modalHeader">
      <div class="modalTitle">CHICKENS</div>
      <button class="close" onclick="closeRoster()">✕</button>
    </div>

    <div id="rosterGrid"></div>

  </div>
</div>

<div id="gachaModal" class="modalWrap">
  <div class="modal blockPanel">

    <div class="modalHeader">
      <div class="modalTitle">GACHA MACHINE</div>
      <button class="close" onclick="closeGacha()">✕</button>
    </div>

    <div id="gachaLayout">

      <div id="gachaMachine">

        <div id="machineBubble">
          <div class="smallEgg" style="left:28px;top:32px"></div>
          <div class="smallEgg" style="left:78px;top:20px;background:#ffd4ec"></div>
          <div class="smallEgg" style="left:128px;top:40px;background:#cbe7ff"></div>
          <div class="smallEgg" style="left:170px;top:66px"></div>
          <div class="smallEgg" style="left:48px;top:95px;background:#d0ffd3"></div>
        </div>

        <div id="machineBody">
          <div id="machineHandle"></div>
        </div>

        <div id="gachaEgg"></div>

      </div>

      <div id="gachaResult">

        <div style="font:10px Orbitron;color:#9ab2c5;margin-top:20px">
          1★ 55% · 2★ 27% · 3★ 12% · 4★ 5% · 5★ 1%
        </div>

        <div id="resultChicken">🥚</div>

        <div id="resultName">READY</div>

        <div id="resultStars">500 EGGS PER ROLL</div>

        <div id="gachaCost">
          Duplicates automatically convert to fragments.
        </div>

        <button id="gachaRoll" class="blockButton" onclick="rollGacha()">
          ROLL · 🥚500
        </button>

      </div>

    </div>

  </div>
</div>

<div id="tutorialModal" class="modalWrap">
  <div class="modal blockPanel">

    <div id="tutorialIcon">🐔</div>

    <div id="tutorialTitle"></div>

    <div id="tutorialText"></div>

    <div id="tutorialControls"></div>

    <button id="tutorialNext" class="blockButton" onclick="nextTutorial()"></button>

  </div>
</div>

<div id="noticeModal" class="modalWrap">
  <div class="modal blockPanel" style="width:min(430px,90vw);text-align:center">

    <div class="modalTitle" id="noticeTitle"></div>

    <div id="noticeText"></div>

    <button class="blockButton" style="width:100%;height:50px" onclick="closeLobbyMessage()">
      CLOSE / 关闭
    </button>

  </div>
</div>

<div id="hud">

  <div id="hudTopLeft" class="hudPanel">
    <div class="bigHud" id="hudChicken"></div>
    <div class="smallHud">
      <span id="killsLabel">KILLS</span>
      <span id="killCount">0</span>
    </div>
  </div>

  <div id="hudTopCenter" class="hudPanel">
    <div class="bigHud" id="waveText">WAVE 1</div>
    <div class="smallHud" id="enemyText">ENEMIES 0</div>
  </div>

  <div id="hudTopRight" class="hudPanel">
    <div class="bigHud">🥚 <span id="battleEggCount">0</span></div>
    <div class="smallHud">
      <span id="levelLabel">LEVEL</span>
      <span id="levelText">1</span>
    </div>
  </div>

  <div id="playerHP">
    <div id="hpText"></div>

    <div class="barBG">
      <div id="hpFill" class="barFill"></div>
    </div>

    <div class="barBG" style="margin-top:5px">
      <div id="xpFill" class="barFill"></div>
    </div>
  </div>

  <div id="skillHud" class="hudPanel">
    <div id="skillName"></div>
    <div id="skillCD"></div>
  </div>

  <div id="message"></div>

  <div id="touchLayer">
    <div id="moveBase">
      <div id="moveKnob"></div>
    </div>
  </div>

  <button id="skillMobile" class="blockButton">SKILL</button>
  <button id="shootMobile" class="blockButton">FIRE</button>

  <div id="dangerIndicator">❗</div>

</div>

<div id="gameOver">
  <div id="gameOverCard" class="blockPanel">

    <div id="gameOverTitle">GAME OVER</div>

    <div id="gameOverStats"></div>

    <button id="returnLobby" class="blockButton" onclick="returnToLobby()">
      RETURN TO LOBBY
    </button>

  </div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   EXPLICIT DOM REFERENCES
========================= */

const $ = id => document.getElementById(id);

const introEl = $("intro");
const lobbyEl = $("lobby");
const hudEl = $("hud");
const gameOverEl = $("gameOver");

const startBattleBtn = $("startBattleBtn");
const langToggle = $("langToggle");

const lobbyEggs = $("lobbyEggs");
const lobbyRank = $("lobbyRank");

const selectedName = $("selectedName");
const selectedStars = $("selectedStars");
const selectedInfo = $("selectedInfo");

const chickensLabel = $("chickensLabel");
const missionsLabel = $("missionsLabel");
const howToLabel = $("howToLabel");
const modeLabel = $("modeLabel");
const mapLabel = $("mapLabel");
const modeName = $("modeName");

const rosterModal = $("rosterModal");
const rosterGrid = $("rosterGrid");

let audioCtx=null;
let aiSoundGate=0;

function ensureAudio(){

  if(!audioCtx){

    audioCtx=
    new(
      window.AudioContext
      ||
      window.webkitAudioContext
    )();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

function tone(
  freq=440,
  duration=.07,
  type="square",
  volume=.03,
  endFreq=0
){

  ensureAudio();

  const oscillator=
  audioCtx.createOscillator();

  const gain=
  audioCtx.createGain();

  oscillator.type=type;

  oscillator.frequency.setValueAtTime(
    freq,
    audioCtx.currentTime
  );

  if(endFreq){

    oscillator.frequency.exponentialRampToValueAtTime(
      Math.max(30,endFreq),
      audioCtx.currentTime+duration
    );
  }

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime+duration
  );
}

function noise(
  duration=.05,
  volume=.02
){

  ensureAudio();

  const count=
  Math.floor(
    audioCtx.sampleRate*duration
  );

  const buffer=
  audioCtx.createBuffer(
    1,
    count,
    audioCtx.sampleRate
  );

  const data=
  buffer.getChannelData(0);

  for(
    let i=0;
    i<count;
    i++
  ){

    data[i]=
    (Math.random()*2-1)
    *
    (1-i/count);
  }

  const source=
  audioCtx.createBufferSource();

  const gain=
  audioCtx.createGain();

  source.buffer=buffer;
  gain.gain.value=volume;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start();
}

function sfxGun(chicken,isAI=false){

  const now=performance.now();

  if(
    isAI
    &&
    now<aiSoundGate
  ){
    return;
  }

  if(isAI){
    aiSoundGate=now+80;
  }

  if(
    chicken.weapon.includes("Shotgun")
  ){

    noise(
      .1,
      isAI?.02:.05
    );

    tone(
      125,
      .12,
      "sawtooth",
      isAI?.012:.04,
      70
    );

  }else if(
    chicken.weapon.includes("SMG")
    ||
    chicken.weapon.includes("Dual")
  ){

    noise(
      .035,
      isAI?.008:.02
    );

    tone(
      260,
      .04,
      "square",
      isAI?.01:.02,
      150
    );

  }else{

    noise(
      .045,
      isAI?.01:.025
    );

    tone(
      220,
      .06,
      "square",
      isAI?.012:.028,
      120
    );
  }
}

function box(

  sy,
  sz,
  color
){

    .28,

    .35,

  const eye1=
  box(
    .12,
    .12,
    .08,

  );

function addTree(x,z){

  const trunk=
  box(
    .65,
    2,
    .65,
    0x6f4a2d
  );

  trunk.position.set(
    x,
    1,
    z
  );

  world.add(trunk);

  const leaf=
  box(
    2,
    2,
    2,
    0x2e6b43
  );

  leaf.position.set(
    x,
    2.7,
    z
  );

  world.add(leaf);
}

function addGrass(x,z){

  const group=
  new THREE.Group();

  for(
    let i=0;
    i<8;
    i++
  ){

    const blade=
    box(
      .25,
      .65,
      .25,
      0xc8a94a
    );

    const angle=
    i/8*Math.PI*2;

    blade.position.set(
      Math.cos(angle)*.75,
      .32,
      Math.sin(angle)*.75
    );

    group.add(blade);
  }

  group.position.set(
    x,
    0,
    z
  );

  world.add(group);

  grassZones.push({
    x,
    z,
    radius:1.7
  });
}

function buildArena(){

  clearWorld();

  grassZones=[];

  const limit=
  currentMode===0
  ?
  26
  :
  33;

  const floor=
  box(
    limit*2,
    .35,
    limit*2,
    0x3a5e47
  );

  floor.position.y=-.2;

  world.add(floor);

  const wallHeight=2.4;

  const wallThickness=.8;

  const walls=[

    [0,-limit,limit*2,wallThickness],

    [0,limit,limit*2,wallThickness],

    [-limit,0,wallThickness,limit*2],

    [limit,0,wallThickness,limit*2]

  ];

  for(
    const [
      x,
      z,
      width,
      depth
    ]
    of walls
  ){

    const wall=
    box(
      width,
      wallHeight,
      depth,
      0x59616b
    );

    wall.position.set(
      x,
      wallHeight/2,
      z
    );

    world.add(wall);
  }

  const trees=[
    [-6,-4],
    [7,4],
    [4,-8],
    [-9,8],
    [10,-3],
    [-17,12],
    [16,-12],
    [-14,-16],
    [15,16]
  ];

  trees.forEach(
    position=>
    addTree(
      position[0],
      position[1]
    )
  );

  const grass=[
    [-8,2],
    [7,-7],
    [2,9],
    [-10,-9],
    [10,5],
    [-17,-5],
    [16,8],
    [-5,17]
  ];

  grass.forEach(
    position=>
    addGrass(
      position[0],
      position[1]
    )
  );
}

  });
}

function spawnAIChickens(){

  const pool=
  CHICKENS.filter(
    chicken=>
    chicken.id!==selectedChicken.id
  );

  const rank=
  currentMode===2
  ?
  Math.max(1,getRank())
  :
  2;

  for(
    let i=0;
    i<7;
    i++
  ){

    const chicken=
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];

    const model=
    createChickenModel(
      chicken
    );

    i/7*Math.PI*2;

    20+
    Math.random()*6;

    model.position.set(
      Math.cos(angle)*radius,
      0,
      Math.sin(angle)*radius
    );

    const marker=
    document.createElement(
      "div"
    );

    marker.className=
    "enemyMarker";

      marker
    );

    actors.push({

      id:"ai_"+i,

      type:"ai",

      mesh:model,

      hp:100,

      maxHP:100,

      chicken,

      alive:true,

      fire:.5+Math.random(),

      rank,

      target:null,

      targetLock:0,

      hidden:false,

      revealTimer:0,

      marker

    });

}

   SURVIVAL
========================= */

function makeEnemy(
  type="normal"
){

  const types={

    normal:{
      hp:45,
      speed:2,
      damage:8,
      color:0x6d6d70
    },

    fast:{
      hp:32,
      speed:3.2,
      damage:6,
      color:0x8f7272
    },

    tank:{
      hp:100,
      speed:1.3,
      damage:14,
      color:0x4f5155
    },

    boss:{
      hp:450,
      speed:1.5,
      damage:20,
      color:0x8b3232
    }

  };

  const data=
  types[type];

  const model=
  new THREE.Group();

  const body=
  box(
    1.3,
    1,
    1.5,
    data.color
  );

  body.position.y=.7;

  model.add(body);

  const angle=
  Math.random()*Math.PI*2;

  const radius=
  18+
  Math.random()*7;

  model.position.set(
    Math.cos(angle)*radius,
    0,
    Math.sin(angle)*radius
  );

  world.add(model);

  enemies.push({

    mesh:model,

    type,

    hp:data.hp,

    maxHP:data.hp,

    speed:data.speed,

    damage:data.damage,

    hitCD:0,

    slow:0

  });
}

function startWave(){

  const boss=
  wave%5===0;

  const count=
  boss
  ?
  1
  :
  5+wave*2;

  for(
    let i=0;
    i<count;
    i++
  ){

    if(boss){

      makeEnemy("boss");

    }else{

      const random=
      Math.random();

      makeEnemy(
        random<.18
        ?
        "fast"
        :
        random<.30
        ?
        "tank"
        :
        "normal"
      );
    }
  }

  showMessage(
    save.language==="zh"
    ?
    "第 "+wave+" 波"
    :
    "WAVE "+wave
  );
}

function updateEnemies(dt){

  for(
    const enemy
    of enemies
  ){

    enemy.hitCD-=dt;

    enemy.slow-=dt;

    const direction=
    new THREE.Vector3()
    .subVectors(
      player.position,
      enemy.mesh.position
    );

    direction.y=0;

    const distance=
    direction.length();

    if(distance>.01){
      direction.normalize();
    }

    enemy.mesh.position
    .addScaledVector(
      direction,
      enemy.speed*
      (
        enemy.slow>0
        ?
        .55
        :
        1
      )
      *
      dt
    );

    if(
      distance<1.2
      &&
      enemy.hitCD<=0
    ){

      enemy.hitCD=.65;

      if(shieldTimer<=0){

        playerHP-=enemy.damage;

        const playerActor=
        actors.find(
          actor=>
          actor.type==="player"
        );

        if(playerActor){
          playerActor.hp=playerHP;
        }

        sfxHurt();

      }else{

        showMessage(
          "SHIELD"
        );
      }
    }
  }

  if(
    enemies.length===0
    &&
    gameActive
  ){

    wave++;

    setTimeout(
      startWave,
      700
    );
  }
}

   BULLETS
========================= */

function createBullet(
  origin,
  direction,
  chicken,
  owner,
  scale=1,
  sourceActor=null
){

  const mesh=
  box(
    .18,
    .18,
    .55,
    chicken.id==="ice"
    ?
    0xaeeeff
    :
    chicken.id==="fire"
    ?
    0xff6c21
    :
    0xffe6a4
  );

  mesh.position
  .copy(origin)
  .add(
    new THREE.Vector3(
      0,
      1.05,
      0
    )
  )
  .addScaledVector(
    direction,
    .85
  );

  world.add(mesh);

  bullets.push({

    mesh,

    dir:direction.clone(),

    speed:22,

    damage:
    chicken.damage
    *
    scale
    *
    (
      owner==="player"
      ?
      damageMultiplier
      :
      1
    ),

    life:1.4,

    owner,

    sourceActor,

    chicken,

    pierce:
    owner==="player"
    ?
    bulletPierce
    :
    0

  });
}

function showDamage(
  position,
  amount
){

  const screen=
  position.clone();

  screen.y+=2.5;

  screen.project(camera);

  const element=
  document.createElement(
    "div"
  );

  element.className=
  "damage";

  element.textContent=
  "-"+
  Math.round(amount);

  element.style.left=
  (
    (
      screen.x*.5+.5
    )
    *
    innerWidth
  )
  +
  "px";

  element.style.top=
  (
    (
      -screen.y*.5+.5
    )
    *
    innerHeight
  )
  +
  "px";

  document.body.appendChild(
    element
  );

  setTimeout(
    ()=>element.remove(),
    750
  );
}

function damageActor(
  target,
  amount,
  source
){

  if(
    !target
    ||
    !target.alive
    ||
    target===source
  ){
    return;
  }

  target.hp-=amount;

  target.revealTimer=2.3;

  target.hidden=false;

  sfxHit();

  showDamage(
    target.mesh.position,
    amount
  );

  if(
    target.type==="player"
  ){

    playerHP=
    Math.max(
      0,
      target.hp
    );

    sfxHurt();
  }

  if(
    target.hp<=0
  ){

    target.hp=0;

    target.alive=false;

    sfxDeath();

    if(target.marker){

      target.marker.remove();

      target.marker=null;
    }

    if(
      target.type==="ai"
    ){

      world.remove(
        target.mesh
      );
    }

    if(
      source
      &&
      source.type==="player"
    ){

      kills++;
    }

    if(
      target.type==="player"
    ){

      endGame();
    }
  }
}

function updateBullets(dt){

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const bullet=
    bullets[i];

    bullet.mesh.position
    .addScaledVector(
      bullet.dir,
      bullet.speed*dt
    );

    bullet.life-=dt;

    let remove=false;

    if(
      currentMode===0
    ){

      for(
        let j=enemies.length-1;
        j>=0;
        j--
      ){

        const enemy=
        enemies[j];

        if(
          bullet.mesh.position
          .distanceTo(
            enemy.mesh.position
          )
          <
          .75
        ){

          enemy.hp-=
          bullet.damage;

          sfxHit();

          showDamage(
            enemy.mesh.position,
            bullet.damage
          );

          if(
            bullet.chicken.id==="ice"
          ){
            enemy.slow=2.5;
          }

          if(
            enemy.hp<=0
          ){

            enemyDeath(
              enemy,
              j
            );
          }

          if(
            bullet.pierce>0
          ){

            bullet.pierce--;

          }else{

            remove=true;
          }

          break;
        }
      }

    }else{

      for(
        const actor
        of actors
      ){

        if(
          !actor.alive
          ||
          actor===bullet.sourceActor
        ){
          continue;
        }

        const dx=
        bullet.mesh.position.x
        -
        actor.mesh.position.x;

        const dz=
        bullet.mesh.position.z
        -
        actor.mesh.position.z;

        if(
          dx*dx+dz*dz
          <
          .75*.75
        ){

          damageActor(
            actor,
            bullet.damage,
            bullet.sourceActor
          );

          remove=true;

          break;
        }
      }
    }

    if(
      bullet.life<=0
    ){

      remove=true;
    }

    if(remove){

      world.remove(
        bullet.mesh
      );

      bullets.splice(
        i,
        1
      );
    }
  }
}

function enemyDeath(
  enemy,
  index
){

  const position=
  enemy.mesh.position.clone();

  world.remove(
    enemy.mesh
  );

  enemies.splice(
    index,
    1
  );

  kills++;

  sfxDeath();

  if(
    Math.random()<.75
  ){
    spawnPickup(
      position,
      "xp"
    );
  }

  if(
    Math.random()<.2
  ){
    spawnPickup(
      position,
      "egg"
    );
  }
}

   SHOOT
========================= */

function currentAimDir(){

  const direction=
  new THREE.Vector3()
  .subVectors(
    aimPoint,
    player.position
  );

  direction.y=0;

  if(
    direction.lengthSq()<.01
  ){

    return new THREE.Vector3(
      0,
      0,
      1
    )
    .applyAxisAngle(
      new THREE.Vector3(
        0,
        1,
        0
      ),
      player.rotation.y
    );
  }

  return direction.normalize();
}

function exposePlayer(){

  playerHidden=false;

  const actor=
  actors.find(
    actor=>
    actor.type==="player"
  );

  if(actor){

    actor.revealTimer=2.3;

    actor.hidden=false;
  }
}

function shoot(){

  if(
    !gameActive
    ||
    paused
    ||
    fireCooldown>0
    ||
    !player
  ){
    return;
  }

  const chicken=
  selectedChicken;

  fireCooldown=
  chicken.fireRate
  *
  (
    frenzyTimer>0
    ?
    .55
    :
    1
  )
  *
  fireMultiplier;

  const source=
  actors.find(
    actor=>
    actor.type==="player"
  );

  const base=
  currentAimDir();

  exposePlayer();

  sfxGun(
    chicken,
    false
  );

  let shots=1;

  let spread=.02;

  if(
    chicken.weapon==="Shotgun"
  ){

    shots=5;

    spread=.28;
  }

  if(
    chicken.weapon==="Dual Pistols"
  ){

    shots=2;

    spread=.08;
  }

  for(
    let i=0;
    i<shots;
    i++
  ){

    const direction=
    base.clone();

    direction.applyAxisAngle(

      new THREE.Vector3(
        0,
        1,
        0
      ),

      (
        i-
        (
          shots-1
        )/2
      )
      *
      spread
    );

    createBullet(
      player.position,
      direction,
      chicken,
      "player",
      1,
      source
    );
  }
}

function beginSkill(){

  if(
    !gameActive
    ||
    paused
    ||
    skillCooldown>0
  ){
    return;
  }

  skillAiming=true;

  if(
    [
      "doctor",
      "robot",
      "black",
      "blue"
    ]
    .includes(
      selectedChicken.id
    )
  ){
    castSkill();
  }
}

function castSkill(){

  if(
    !skillAiming
    ||
    skillCooldown>0
  ){
    return;
  }

  skillAiming=false;

  skillCooldown=
  selectedChicken.skillCD;

  sfxSkill();

  exposePlayer();

  if(
    selectedChicken.id==="doctor"
  ){

    playerHP=
    Math.min(
      maxHP,
      playerHP+35
    );

    const actor=
    actors.find(
      actor=>
      actor.type==="player"
    );

    if(actor){
      actor.hp=playerHP;
    }

    showMessage("+35 HP");

    return;
  }

  if(
    selectedChicken.id==="robot"
  ){

    shieldTimer=4;

    showMessage(
      "SHIELD"
    );

    return;
  }

  if(
    selectedChicken.id==="black"
  ){

    frenzyTimer=5;

    showMessage(
      "FRENZY"
    );

    return;
  }

  if(
    selectedChicken.id==="blue"
  ){

    speedTimer=5;

    showMessage(
      "SPEED"
    );

    return;
  }

  const direction=
  currentAimDir();

  createBullet(
    player.position,
    direction,
    selectedChicken,
    "player",
    2,
    actors.find(
      actor=>
      actor.type==="player"
    )
  );

/* =========================
   AI
========================= */

function actorInGrass(actor){

  return grassZones.some(

    zone=>{

      const dx=
      actor.mesh.position.x-zone.x;

      const dz=
      actor.mesh.position.z-zone.z;

      return(
        dx*dx+dz*dz
        <
        zone.radius*zone.radius
      );
    }

  );
}

function chooseAITarget(ai){

  const possible=
  actors.filter(

    actor=>
    actor.alive
    &&
    actor!==ai
    &&
    !(
      actor.hidden
      &&
      actor.revealTimer<=0
      &&
      actor.mesh.position
      .distanceTo(
        ai.mesh.position
      )
      >
      5
    )

  );

  if(
    possible.length===0
  ){
    return null;
  }

  possible.sort(

    (a,b)=>

    a.mesh.position
    .distanceTo(
      ai.mesh.position
    )

    -

    b.mesh.position
    .distanceTo(
      ai.mesh.position
    )

  );

  return possible[0];
}

function updateAI(dt){

  const livingAI=
  actors.filter(
    actor=>
    actor.type==="ai"
    &&
    actor.alive
  );

  for(
    const ai
    of livingAI
  ){

    ai.fire-=dt;

    ai.targetLock-=dt;

    ai.revealTimer=
    Math.max(
      0,
      ai.revealTimer-dt
    );

    ai.hidden=
    actorInGrass(ai)
    &&
    ai.revealTimer<=0;

    if(
      !ai.target
      ||
      !ai.target.alive
      ||
      ai.targetLock<=0
    ){

      ai.target=
      chooseAITarget(ai);

      ai.targetLock=
      2.7+
      Math.random()*2.6;
    }

    if(!ai.target){
      continue;
    }

    const direction=
    new THREE.Vector3()
    .subVectors(
      ai.target.mesh.position,
      ai.mesh.position
    );

    direction.y=0;

    const distance=
    direction.length();

    if(distance<.001){
      continue;
    }

    direction.normalize();

    const keepDistance=
    Math.min(
      ai.chicken.range*.72,
      8
    );

    const strafe=
    new THREE.Vector3(
      -direction.z,
      0,
      direction.x
    );

    if(
      distance>
      keepDistance+1
    ){

      ai.mesh.position
      .addScaledVector(
        direction,
        2.2*dt
      );

    }else if(
      distance<
      keepDistance-1
    ){

      ai.mesh.position
      .addScaledVector(
        direction,
        -1.2*dt
      );
    }

    ai.mesh.position
    .addScaledVector(
      strafe,
      Math.sin(
        performance.now()*.001+
        ai.mesh.position.x
      )
      *
      .6
      *
      dt
    );

    ai.mesh.position.x=
    THREE.MathUtils.clamp(
      ai.mesh.position.x,
      -31.2,
      31.2
    );

    ai.mesh.position.z=
    THREE.MathUtils.clamp(
      ai.mesh.position.z,
      -31.2,
      31.2
    );

    ai.mesh.rotation.y=
    Math.atan2(
      direction.x,
      direction.z
    );

    if(
      ai.fire<=0
      &&
      distance<
      ai.chicken.range
      &&
      !ai.target.hidden
    ){

      ai.fire=
      Math.max(
        .38,
        ai.chicken.fireRate*2
      )
      +
      .15+
      Math.random()*.25;

      const error=
      Math.max(
        .03,
        .24-ai.rank*.025
      );

      const shot=
      direction.clone()
      .applyAxisAngle(
        new THREE.Vector3(
          0,
          1,
          0
        ),
        (
          Math.random()-.5
        )
        *
        error
      );

      createBullet(
        ai.mesh.position,
        shot,
        ai.chicken,
        "ai",
        .7,
        ai
      );

      sfxGun(
        ai.chicken,
        true
      );

      ai.revealTimer=2.3;

      ai.hidden=false;
    }
  }

  updateAIMarkers();

  if(
    livingAI.length===0
    &&
    gameActive
  ){

    showMessage(
      "YOU WIN!"
    );

    setTimeout(
      endGame,
      900
    );
  }
}

function updateAIMarkers(){

  actors
  .filter(
    actor=>
    actor.type==="ai"
  )
  .forEach(

    ai=>{

      if(!ai.marker){
        return;
      }

      if(
        !ai.alive
        ||
        ai.hidden
      ){

        ai.marker.style.display=
        "none";

        return;
      }

      const screen=
      ai.mesh.position.clone();

      screen.y+=3;

      screen.project(camera);

      const visible=
      screen.z<1
      &&
      screen.x>-1.05
      &&
      screen.x<1.05
      &&
      screen.y>-1.05
      &&
      screen.y<1.05;

      ai.marker.style.display=
      visible
      ?
      "block"
      :
      "none";

      if(visible){

        ai.marker.style.left=
        (
          (
            screen.x*.5+.5
          )
          *
          innerWidth
        )
        +
        "px";

        ai.marker.style.top=
        (
          (
            -screen.y*.5+.5
          )
          *
          innerHeight
        )
        +
        "px";
      }
    }
  );
}

/* =========================
   GRASS
========================= */

function updateGrass(){

  playerHidden=false;

  for(
    const zone
    of grassZones
  ){

    const dx=
    player.position.x-zone.x;

    const dz=
    player.position.z-zone.z;

    if(
      dx*dx+dz*dz
      <
      zone.radius*zone.radius
    ){

      playerHidden=true;

      break;
    }
  }

  const playerActor=
  actors.find(
    actor=>
    actor.type==="player"
  );

  if(
    playerActor
    &&
    playerActor.revealTimer>0
  ){

    playerHidden=false;
  }

  player.traverse(

    child=>{

      if(
        child.material
      ){

        child.material.transparent=true;

        child.material.opacity=
        playerHidden
        ?
        .55
        :
        1;
      }
    }

  );

  let danger=false;

  if(
    currentMode>0
  ){

    for(
      const ai
      of actors.filter(
        actor=>
        actor.type==="ai"
        &&
        actor.alive
      )
    ){

      ai.hidden=
      actorInGrass(ai)
      &&
      ai.revealTimer<=0;

      if(
        ai.hidden
        &&
        ai.mesh.position
        .distanceTo(
          player.position
        )
        <
        6.2
      ){

        danger=true;
      }
    }
  }

  dangerIndicator.style.display=
  danger
  ?
  "block"
  :
  "none";

  if(
    danger
    &&
    dangerCD<=0
  ){

    dangerCD=2;

    sfxChicken();
  }
}

  )
  -

  let z=
  (
    keys.KeyS?1:0
  )
  -
  (
    keys.KeyW?1:0
  )
  +
  joyY;

  const length=
  Math.hypot(
    x,
    z
  );

  if(length>1){

    x/=length;

    z/=length;
  }

  const speed=
  selectedChicken.speed
  *
  moveMultiplier
  *
  (
    speedTimer>0
    ?
    1.55
    :
    1
  );

  moveVelocity.x=
  THREE.MathUtils.lerp(
    moveVelocity.x,
    x*speed,
    .18
  );

  moveVelocity.y=
  THREE.MathUtils.lerp(
    moveVelocity.y,
    z*speed,
    .18
  );

  player.position.x+=
  moveVelocity.x*dt;

  player.position.z+=
  moveVelocity.y*dt;

  const limit=
  currentMode===0
  ?
  24.5
  :
  31.2;

  player.position.x=
  THREE.MathUtils.clamp(
    player.position.x,
    -limit,
    limit
  );

  player.position.z=
  THREE.MathUtils.clamp(
    player.position.z,
    -limit,
    limit
  );

  if(
    rightMouseDown
    ||
    mobileAiming
    ||
    skillAiming
  ){

    const direction=
    currentAimDir();

    player.rotation.y=
    Math.atan2(
      direction.x,
      direction.z
    );
  }
}

/* =========================
   DESKTOP AIM
========================= */

function setAim(
  clientX,
  clientY
){

  mouse.x=
  clientX/innerWidth*2-1;

  mouse.y=
  -(clientY/innerHeight)*2+1;

  raycaster.setFromCamera(
    mouse,
    camera
  );

  raycaster.ray.intersectPlane(
    aimPlane,
    aimPoint
  );
}

addEventListener(
  "contextmenu",
  event=>
  event.preventDefault()
);

addEventListener(

  "pointermove",

  event=>{

    if(
      !gameActive
      ||
      event.pointerType==="touch"
    ){
      return;
    }

    if(
      rightMouseDown
      ||
      skillAiming
    ){

      setAim(
        event.clientX,
        event.clientY
      );
    }
  }

);

addEventListener(

  "pointerdown",

  event=>{

    if(
      !gameActive
      ||
      paused
      ||
      event.pointerType==="touch"
    ){
      return;
    }

    if(
      event.button===2
    ){

      rightMouseDown=true;

      setAim(
        event.clientX,
        event.clientY
      );

      return;
    }

    if(
      event.button===0
      &&
      rightMouseDown
    ){

      mouseDown=true;

      shoot();
    }
  }

);

addEventListener(

  "pointerup",

  event=>{

    if(
      event.pointerType==="touch"
    ){
      return;
    }

    if(
      event.button===2
    ){
      rightMouseDown=false;
    }

    if(
      event.button===0
    ){
      mouseDown=false;
    }
  }

);

/* =========================
   MOBILE
========================= */

let moveID=null;

let aimID=null;

let moveCX=0;

let moveCY=0;

touchLayer.addEventListener(

  "pointerdown",

  event=>{

    if(
      event.pointerType!=="touch"
      &&
      event.pointerType!=="pen"
    ){
      return;
    }

    event.preventDefault();

    if(
      event.clientX<
      innerWidth*.48
      &&
      moveID===null
    ){

      moveID=
      event.pointerId;

      moveCX=
      event.clientX;

      moveCY=
      event.clientY;

      moveBase.style.left=
      moveCX+"px";

      moveBase.style.top=
      moveCY+"px";

      moveBase.style.display=
      "block";

    }else if(
      aimID===null
    ){

      aimID=
      event.pointerId;

      mobileAiming=true;

      setAim(
        event.clientX,
        event.clientY
      );
    }
  },

  {passive:false}

);

touchLayer.addEventListener(

  "pointermove",

  event=>{

    if(
      event.pointerId===moveID
    ){

      event.preventDefault();

      let dx=
      event.clientX-moveCX;

      let dy=
      event.clientY-moveCY;

      const max=42;

      const length=
      Math.hypot(
        dx,
        dy
      );

      if(
        length>max
      ){

        dx*=max/length;

        dy*=max/length;
      }

      joyX=
      dx/max;

      joyY=
      dy/max;

      moveKnob.style.transform=
      `translate(${dx}px,${dy}px)`;

    }else if(
      event.pointerId===aimID
    ){

      event.preventDefault();

      mobileAiming=true;

      setAim(
        event.clientX,
        event.clientY
      );
    }
  },

  {passive:false}

);

function endTouch(event){

  if(
    event.pointerId===moveID
  ){

    moveID=null;

    joyX=0;

    joyY=0;

    moveBase.style.display=
    "none";

    moveKnob.style.transform=
    "translate(0,0)";
  }

  if(
    event.pointerId===aimID
  ){

    aimID=null;

    mobileAiming=false;
  }
}

touchLayer.addEventListener(
  "pointerup",
  endTouch,
  {passive:false}
);

touchLayer.addEventListener(
  "pointercancel",
  endTouch,
  {passive:false}
);

shootMobile.addEventListener(

  "pointerdown",

  event=>{

    event.preventDefault();

    event.stopPropagation();

    mouseDown=true;

    mobileAiming=true;

    if(
      aimID===null
      &&
      player
    ){

      const forward=
      new THREE.Vector3(
        0,
        0,
        1
      )
      .applyAxisAngle(
        new THREE.Vector3(
          0,
          1,
          0
        ),
        player.rotation.y
      );

      aimPoint
      .copy(
        player.position
      )
      .addScaledVector(
        forward,
        10
      );
    }

    shoot();
  },

  {passive:false}

);

shootMobile.addEventListener(

  "pointerup",

  event=>{

    event.preventDefault();

    event.stopPropagation();

    mouseDown=false;

    if(
      aimID===null
    ){

      mobileAiming=false;
    }
  },

  {passive:false}

);

skillMobile.addEventListener(

  "pointerdown",

  event=>{

    event.preventDefault();

    event.stopPropagation();

    beginSkill();
  },

  {passive:false}

);

skillMobile.addEventListener(

  "pointerup",

  event=>{

    event.preventDefault();

    event.stopPropagation();

    if(skillAiming){
      castSkill();
    }
  },

  {passive:false}

);

/* ANTI ZOOM */

let lastTouchEnd=0;

document.addEventListener(

  "touchend",

  event=>{

    const now=
    Date.now();

    if(
      now-lastTouchEnd<=320
    ){

      event.preventDefault();
    }

    lastTouchEnd=now;
  },

  {passive:false}

);

document.addEventListener(
  "gesturestart",
  event=>
  event.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  event=>
  event.preventDefault(),
  {passive:false}
);

/* =========================
   ROSTER
========================= */

window.openRoster=function(){

  renderRoster();

  rosterModal.classList.add(
    "show"
  );
};

window.closeRoster=function(){

  rosterModal.classList.remove(
    "show"
  );
};

function renderRoster(){

  rosterGrid.innerHTML="";

  CHICKENS.forEach(

    chicken=>{

      const unlocked=
      save.unlocked.includes(
        chicken.id
      );

      const card=
      document.createElement(
        "div"
      );

      card.className=
      "chickenCard"
      +
      (
        unlocked
        ?
        ""
        :
        " locked"
      );

      card.innerHTML=
      `
      <div
        class="cardColor"
        style="background:#${chicken.color.toString(16).padStart(6,"0")}"
      ></div>

      <div class="cardName">
        ${
          save.language==="zh"
          ?
          chicken.zh
          :
          chicken.name
        }
      </div>

      <div class="cardStars">
        ${"★".repeat(chicken.stars)}
      </div>

      <div class="cardWeapon">
        ${chicken.weapon}
      </div>
      `;

      if(unlocked){

        card.onclick=
        function(){

          save.selected=
          chicken.id;

          selectedChicken=
          chicken;

          saveGame();

          window.closeRoster();

          buildLobbyScene();

          updateLobbyUI();
        };
      }

      rosterGrid.appendChild(
        card
      );
    }

  );
}

/* =========================
   GACHA
========================= */

window.openGacha=function(){
  gachaModal.classList.add(
    "show"
  );
};

window.closeGacha=function(){
  gachaModal.classList.remove(
    "show"
  );
};

let rolling=false;

window.rollGacha=function(){

  if(
    rolling
    ||
    save.eggs<500
  ){
    return;
  }

  rolling=true;

  save.eggs-=500;

  saveGame();

  updateLobbyUI();

  sfxGacha();

  machineHandle.style.transform=
  "rotate(85deg)";

  setTimeout(
    ()=>{

      machineHandle.style.transform=
      "rotate(0deg)";

      gachaEgg.classList.add(
        "show"
      );
    },
    350
  );

  setTimeout(
    ()=>{

      const random=
      Math.random();

      const stars=
      random<.55
      ?
      1
      :
      random<.82
      ?
      2
      :
      random<.94
      ?
      3
      :
      random<.99
      ?
      4
      :
      5;

      const pool=
      CHICKENS.filter(
        chicken=>
        chicken.stars===stars
      );

      const chicken=
      pool[
        Math.floor(
          Math.random()*pool.length
        )
      ];

      const duplicate=
      save.unlocked.includes(
        chicken.id
      );

      if(!duplicate){

        save.unlocked.push(
          chicken.id
        );

      }else{

        const amounts={
          1:10,
          2:25,
          3:60,
          4:150,
          5:400
        };

        save.fragments[chicken.id]=
        (
          save.fragments[chicken.id]
          ||
          0
        )
        +
        amounts[stars];
      }

      saveGame();

      gachaEgg.classList.remove(
        "show"
      );

      resultChicken.textContent=
      "🐔";

      resultName.textContent=
      save.language==="zh"
      ?
      chicken.zh
      :
      chicken.name;

      resultStars.textContent=
      "★".repeat(stars);

      gachaCost.textContent=
      duplicate
      ?
      "DUPLICATE → FRAGMENTS"
      :
      "NEW CHICKEN!";

      sfxChicken();

      rolling=false;

    },
    1300
  );
};

/* =========================
   UI
========================= */

function updateLobbyUI(){

  lobbyEggs.textContent=
  save.eggs;

  lobbyRank.textContent=
  RANKS[
    getRank()
  ];

  selectedName.textContent=
  save.language==="zh"
  ?
  selectedChicken.zh
  :
  selectedChicken.name;

  selectedStars.textContent=
  "★".repeat(
    selectedChicken.stars
  );

  selectedInfo.innerHTML=
  `
  ${save.language==="zh"?"武器":"Weapon"}:
  ${selectedChicken.weapon}
  <br>
  ${save.language==="zh"?"技能":"Skill"}:
  ${selectedChicken.skill}
  `;

  modeName.textContent=
  MODES[currentMode];
}

function updateHUD(){

  if(!selectedChicken){
    return;
  }

  hudChicken.textContent=
  save.language==="zh"
  ?
  selectedChicken.zh
  :
  selectedChicken.name;

  killCount.textContent=
  kills;

  waveText.textContent=
  currentMode===0
  ?
  (
    save.language==="zh"
    ?
    "第 "+wave+" 波"
    :
    "WAVE "+wave
  )
  :
  "BRAWL";

  enemyText.textContent=
  currentMode===0
  ?
  (
    save.language==="zh"
    ?
    "敌人 "
    :
    "ENEMIES "
  )
  +
  enemies.length
  :
  (
    save.language==="zh"
    ?
    "存活 "
    :
    "ALIVE "
  )
  +
  actors.filter(
    actor=>
    actor.alive
  ).length;

  battleEggCountEl.textContent=
  battleEggTotal;

  levelText.textContent=
  level;

  hpText.textContent=
  `HP ${Math.max(0,Math.round(playerHP))} / ${maxHP}`;

  hpFill.style.width=
  Math.max(
    0,
    playerHP/maxHP*100
  )
  +
  "%";

  xpFill.style.width=
  Math.min(
    100,
    xp/xpNeeded*100
  )
  +
  "%";

  skillName.textContent=
  selectedChicken.skill.toUpperCase();

  skillCD.textContent=
  skillCooldown<=0
  ?
  "E · READY"
  :
  "E · "+
  skillCooldown.toFixed(1)
  +
  "s";
}

function showMessage(text){

  messageEl.textContent=text;

  messageEl.classList.add(
    "show"
  );

  clearTimeout(
    messageEl.timer
  );

  messageEl.timer=
  setTimeout(
    ()=>messageEl.classList.remove(
      "show"
    ),
    900
  );
}

window.changeMode=function(direction){

  currentMode=
  (
    currentMode
    +
    direction
    +
    MODES.length
  )
  %
  MODES.length;

  updateLobbyUI();
};

/* =========================
   START MATCH
========================= */

function clearMarkers(){

  document
  .querySelectorAll(
    ".enemyMarker"
  )
  .forEach(
    marker=>
    marker.remove()
  );
}

window.startBattle=function(){

  try{

    ensureAudio();

    clearMarkers();

    /* reset state BEFORE building game */

    actors=[];

    enemies=[];

    bullets=[];

    pickups=[];

    fx=[];

    player=null;

    playerHP=100;

    maxHP=100;

    kills=0;

    battleEggTotal=0;

    level=1;

    xp=0;

    xpNeeded=30;

    wave=1;

    damageMultiplier=1;

    moveMultiplier=1;

    fireMultiplier=1;

    bulletPierce=0;

    fireCooldown=0;

    skillCooldown=0;

    speedTimer=0;

    shieldTimer=0;

    frenzyTimer=0;

    mouseDown=false;

    rightMouseDown=false;

    mobileAiming=false;

    skillAiming=false;

    moveVelocity.set(
      0,
      0
    );

    joyX=0;

    joyY=0;

    buildArena();

    lobbyMode=false;

    gameActive=true;

    paused=false;

    spawnPlayer();

    if(
      currentMode===0
    ){

      startWave();

    }else{

      spawnAIChickens();
    }

    lobbyEl.style.display=
    "none";

    hudEl.style.display=
    "block";

    gameOverEl.style.display=
    "none";

    sfxChicken();

    showMessage(
      MODES[currentMode]
    );

    updateHUD();

  }catch(error){

    console.error(
      "START BATTLE ERROR:",
      error
    );

    lobbyEl.style.display=
    "block";

    hudEl.style.display=
    "none";

    alert(
      "Game start error: "+
      error.message
    );
  }
};

/* =========================
   GAME OVER
========================= */

function endGame(){

  if(!gameActive){
    return;
  }

  gameActive=false;

  save.eggs+=
  battleEggTotal;

  saveGame();

  gameOverEl.style.display=
  "flex";

  gameOverStats.innerHTML=
  `
  MODE: ${MODES[currentMode]}
  <br>
  KILLS: ${kills}
  <br>
  EGGS: +${battleEggTotal}
  <br>
  LEVEL: ${level}
  <br>
  RANK: ${RANKS[getRank()]}
  `;
}

window.returnToLobby=function(){

  clearMarkers();

  gameOverEl.style.display=
  "none";

  hudEl.style.display=
  "none";

  lobbyEl.style.display=
  "block";

  gameActive=false;

  paused=false;

  mouseDown=false;

  rightMouseDown=false;

  mobileAiming=false;

  skillAiming=false;

  lobbyMode=true;

  buildLobbyScene();

  updateLobbyUI();
};

/* =========================
   CAMERA
========================= */

function updateCamera(){

  if(lobbyMode){

    const time=
    performance.now()*.0003;

    camera.position.set(
      Math.sin(time)*2.2,
      9,
      14+
      Math.cos(time)*1.4
    );

    camera.lookAt(
      0,
      1,
      0
    );

    return;
  }

  if(!player){
    return;
  }

  if(
    currentMode>0
  ){

    const mobile=
    matchMedia(
      "(pointer:coarse)"
    ).matches;

    const desired=
    new THREE.Vector3(
      0,
      mobile?40:44,
      mobile?35:39
    );

    camera.position.lerp(
      desired,
      .07
    );

    camera.lookAt(
      0,
      .4,
      0
    );

  }else{

    const desired=
    player.position
    .clone()
    .add(
      new THREE.Vector3(
        0,
        18,
        16
      )
    );

    camera.position.lerp(
      desired,
      .09
    );

    camera.lookAt(
      player.position.x,
      .6,
      player.position.z
    );
  }
}

/* =========================
   LOOP
========================= */

function updateTimers(dt){

  fireCooldown-=dt;

  skillCooldown-=dt;

  frenzyTimer-=dt;

  speedTimer-=dt;

  shieldTimer-=dt;

  dangerCD-=dt;

  const playerActor=
  actors.find(
    actor=>
    actor.type==="player"
  );

  if(playerActor){

    playerActor.revealTimer=
    Math.max(
      0,
      playerActor.revealTimer-dt
    );
  }

  if(
    mouseDown
    &&
    gameActive
    &&
    !paused
    &&
    (
      rightMouseDown
      ||
      mobileAiming
    )
  ){

    shoot();
  }
}

const clock=
new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
  Math.min(
    clock.getDelta(),
    .035
  );

  updateCamera();

  if(
    gameActive
    &&
    !paused
  ){

    updateTimers(dt);

    updatePlayer(dt);

    updateBullets(dt);

    updateGrass();

    if(
      currentMode===0
    ){

      updateEnemies(dt);

      updatePickups(dt);

      if(
        playerHP<=0
      ){

        endGame();
      }

    }else{

      updateAI(dt);
    }

    updateHUD();
  }

  renderer.render(
    scene,
    camera
  );
}

animate();

/* =========================
   RESIZE
========================= */

addEventListener(

  "resize",

  ()=>{

    camera.aspect=
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }

);

/* =========================
   INITIAL
========================= */

setTimeout(
  ()=>introEl.classList.add("hide"),
  1300
);

buildLobbyScene();

updateLobbyUI();

applyLanguage();

setTimeout(
  ()=>{
    if(
      !save.tutorialSeen
    ){
      window.openTutorial();
    }
  },
  2200
);

</script>
